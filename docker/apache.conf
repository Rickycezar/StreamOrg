# StreamOrg virtual host. Only public/ is served; src/, config/, bin/,
# vendor/ and the session files sit outside the document root.
ServerName localhost
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Every path that is not a real file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # Downloaded artwork is data, never code.
    <Directory /var/www/html/public/media>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
    </Directory>

    # Hosted games (bin/update_game.php) are static packages: no PHP runs
    # from them.
    <Directory /var/www/html/public/games>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
    </Directory>

    # A game runs under its own policy (the integration contract's, kept in
    # step with GameFiles::CSP), framed by StreamOrg's pages and readable
    # from the sandboxed frame. Its text changes come from index.php.
    <LocationMatch "^/games/">
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://irc-ws.chat.twitch.tv; frame-ancestors 'self'"
        Header always set Access-Control-Allow-Origin "*"
        Header always set X-Content-Type-Options "nosniff"
        Header always unset X-Frame-Options
        Header always unset Cross-Origin-Opener-Policy
        Header set Cache-Control "public, max-age=300"
    </LocationMatch>

    # Assets and artwork are versioned with ?v=…, so they can be cached long.
    <LocationMatch "^/(assets|media)/">
        Header set Cache-Control "public, max-age=2592000"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # Logs go to the container's output, where Coolify shows them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
