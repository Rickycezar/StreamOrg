# StreamOrg virtual host. Only public/ is served; src/, config/, bin/,
# vendor/ and the session files sit outside the document root.
ServerName localhost
TraceEnable Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Every path that is not a real file goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # Downloaded artwork is data, never code.
    <Directory /var/www/html/public/media>
        php_admin_flag engine off
        Options -Indexes -ExecCGI
    </Directory>

    # Assets and artwork are versioned with ?v=…, so they can be cached long.
    <LocationMatch "^/(assets|media)/">
        Header set Cache-Control "public, max-age=2592000"
        Header always set X-Content-Type-Options "nosniff"
    </LocationMatch>

    # Logs go to the container's output, where Coolify shows them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
