; StreamOrg production settings, layered over php.ini-production.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Stack traces never carry argument values (passwords, keys).
zend.exception_ignore_args = On

memory_limit = 256M
max_execution_time = 60
post_max_size = 24M
upload_max_filesize = 10M

date.timezone = UTC

session.use_strict_mode = 1
session.cookie_httponly = 1
session.use_only_cookies = 1

; The code never changes inside a running container: no need to re-check files.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
